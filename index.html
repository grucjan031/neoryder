<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="NEORYDER — FPP roguelite w świecie cyberpunk."
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="NEORYDER" />
    <meta property="og:image" content="/icon-512.png" />
    <title>NEORYDER</title>
    <style>
      /* Nakładka startowa: widoczna przed uruchomieniem JS, zdejmowana przez src/ui/bootSplash.ts. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: var(--z-boot, 1100);
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 10px;
        overflow: hidden;
        background: #05070b;
        color: #f2efe8;
        font:
          600 15px/1.2 'Chakra Petch',
          'Segoe UI',
          sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        pointer-events: auto;
        transition: opacity 320ms ease-out;
      }
      #boot-splash.boot-splash--out {
        opacity: 0;
        pointer-events: none;
      }
      .boot-splash__brand {
        position: relative;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: 0.32em;
        text-shadow: 0 2px 12px #000;
      }
      .boot-splash__loading {
        position: relative;
        color: #bcc1ca;
        text-shadow: 0 1px 6px #000;
      }
      /* Pasek postępu: nieokreślony do pierwszego setProgress() z src/ui/bootSplash.ts. */
      .boot-splash__progress {
        position: relative;
        z-index: 2;
        width: min(22rem, 60vw);
        height: 4px;
        margin-top: 6px;
        overflow: hidden;
        background: rgb(150 164 186 / 28%);
        --boot-progress: 0;
      }
      .boot-splash__progress > span {
        display: block;
        height: 100%;
        width: calc(var(--boot-progress) * 100%);
        background: #ffb547;
        transition: width 180ms ease-out;
      }
      .boot-splash__progress.is-indeterminate > span {
        width: 38%;
        animation: boot-splash-indeterminate 1.2s ease-in-out infinite;
      }
      @keyframes boot-splash-indeterminate {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(260%);
        }
      }
      .boot-splash__img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 400ms ease-out;
        animation: boot-splash-zoom 16s ease-out forwards;
      }
      .boot-splash__img.is-loaded {
        opacity: 1;
      }
      #boot-splash.boot-splash--art {
        place-content: end center;
        padding-bottom: 10vh;
      }
      .boot-splash--art .boot-splash__loading {
        color: #e4e0d6;
      }
      .boot-splash--art::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(
          to top,
          rgba(2, 4, 9, 0.94) 0,
          rgba(2, 4, 9, 0.55) 40%,
          rgba(2, 4, 9, 0.15) 75%,
          transparent
        );
      }
      .boot-splash--art .boot-splash__brand,
      .boot-splash--art .boot-splash__loading {
        z-index: 2;
      }
      .boot-splash__progress > span,
      .boot-splash__progress {
        border-radius: 0;
      }
      .boot-splash__caption {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 2;
        padding: 4px 10px;
        background: rgba(2, 4, 9, 0.72);
        color: #e4e0d6;
        font-size: 14px;
        letter-spacing: 0.12em;
      }
      @keyframes boot-splash-zoom {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.04);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash,
        .boot-splash__img,
        .boot-splash__progress.is-indeterminate > span {
          transition: none;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="boot-splash__brand">NEORYDER</div>
      <div class="boot-splash__loading" aria-live="polite">Ładowanie…</div>
      <div
        class="boot-splash__progress is-indeterminate"
        role="progressbar"
        aria-label="Ładowanie"
        aria-valuemin="0"
        aria-valuemax="100"
      >
        <span></span>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
